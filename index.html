<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComChat - 完全無料ビデオ会議</title>
    <link rel="stylesheet" href="css/style.css?v=7">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">ComChat</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="welcome-screen">
                <h1 class="welcome-title">友達と無料でビデオ通話しよう！</h1>
                <p class="welcome-description">
                    ComChatは完全無料のP2Pビデオ会議アプリです。<br>
                    最大6人まで同時通話が可能で、時間制限もありません。<br>
                    ブラウザだけで動作し、アプリのインストールは不要です。
                </p>
                
                <div class="input-group">
                    <label for="username">あなたの名前</label>
                    <input type="text" id="username" placeholder="名前を入力してください" value="ユーザー">
                </div>

                <div class="btn-group">
                    <button id="create-room" class="btn btn-primary">
                        🏠 ルーム作成
                    </button>
                    <button id="join-room" class="btn btn-secondary">
                        🚪 ルーム参加
                    </button>
                </div>

                <div id="join-group" class="input-group hidden" style="margin-top: 20px;">
                    <label for="join-room-id">ルームID</label>
                    <input type="text" id="join-room-id" placeholder="友達から共有されたルームIDを入力">
                    <button id="confirm-join" class="btn btn-secondary" style="margin-top: 10px; width: 100%;">参加する</button>
                </div>
            </div>

            <!-- Call Screen -->
            <div id="call-screen" class="hidden">
                <div class="call-layout">
                    <!-- Left: Video + Controls + Room Info -->
                    <div class="call-main">
                        <!-- Screen Share (presenter mode) -->
                        <div id="screen-share-container" class="hidden">
                            <video id="screen-share-video" autoplay playsinline></video>
                            <div id="screen-share-placeholder" class="screen-share-placeholder hidden">
                                🖥️<br>画面を共有中
                            </div>
                            <button id="stop-share-btn" class="stop-share-btn">⏹ 画面共有中（クリックで停止）</button>
                            <div id="share-viewer-label" class="share-viewer-label hidden"></div>
                        </div>

                        <!-- Video Grid -->
                        <div id="video-grid" class="video-grid">
                            <!-- Videos will be added here dynamically -->
                        </div>

                        <!-- Controls -->
                        <div class="controls">
                            <div class="ctrl-item">
                                <button id="toggle-video" class="control-btn video" title="カメラ オン/オフ">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <polygon points="23 7 16 12 23 17 23 7"/>
                                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                                    </svg>
                                </button>
                                <span class="ctrl-label">カメラ</span>
                            </div>
                            <div class="ctrl-item">
                                <button id="toggle-audio" class="control-btn audio" title="マイク オン/オフ">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                        <line x1="12" y1="19" x2="12" y2="23"/>
                                        <line x1="8" y1="23" x2="16" y2="23"/>
                                    </svg>
                                </button>
                                <span class="ctrl-label">マイク</span>
                            </div>
                            <div class="ctrl-item">
                                <button id="share-screen" class="control-btn screen" title="画面共有">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                        <polyline points="9 8 12 5 15 8"/>
                                        <line x1="12" y1="5" x2="12" y2="13"/>
                                        <line x1="8" y1="21" x2="16" y2="21"/>
                                        <line x1="12" y1="17" x2="12" y2="21"/>
                                    </svg>
                                </button>
                                <span class="ctrl-label">画面共有</span>
                            </div>
                            <div class="ctrl-item">
                                <button id="bg-filter" class="control-btn filter" title="背景フィルター">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
                                        <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
                                        <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
                                        <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/>
                                        <line x1="17" y1="16" x2="23" y2="16"/>
                                    </svg>
                                </button>
                                <span class="ctrl-label">フィルター</span>
                            </div>
                            <div class="ctrl-item">
                                <button id="hangup" class="control-btn hangup" title="退室">
                                    <svg class="door-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <!-- ドア枠（固定） -->
                                        <rect x="3" y="2" width="18" height="20" rx="1"/>
                                        <!-- ドア葉＋取っ手（ホバーで回転） -->
                                        <g class="door-leaf">
                                            <rect x="4.5" y="3.5" width="15" height="17"/>
                                            <circle cx="17" cy="12" r="1.5" fill="currentColor" stroke="none"/>
                                        </g>
                                    </svg>
                                </button>
                                <span class="ctrl-label">退室</span>
                            </div>
                        </div>

                        <!-- Room Info -->
                        <div id="room-info" class="room-info hidden">
                            <span>ルームID: <span id="room-id-display"></span><button id="copy-room-id" class="copy-btn" title="ルームIDをコピー"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="0" width="11" height="11" rx="2"/><rect x="0" y="5" width="11" height="11" rx="2"/></svg></button></span>
                            <span>参加者: <span id="participant-count">1</span>/6</span>
                            <span class="username-info">名前: <span id="username-current"></span> <button id="edit-username-btn" class="copy-btn edit-btn" title="名前を変更">✏️</button><input id="username-edit-input" class="username-edit-input hidden" type="text" maxlength="20"><button id="username-confirm-btn" class="copy-btn confirm-btn hidden">✓</button></span>
                        </div>
                    </div>

                    <!-- Right: Chat -->
                    <div class="chat-container">
                        <div class="chat-header">チャット</div>
                        <div id="chat-messages" class="chat-messages">
                        </div>
                        <div class="chat-input-container">
                            <input type="file" id="file-input" class="hidden">
                            <button id="file-attach-btn" class="file-attach-btn" title="ファイルを添付">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                                </svg>
                            </button>
                            <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力...">
                            <button id="chat-send" class="chat-send">送信</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 背景フィルターパネル -->
    <div id="filter-panel" class="filter-panel hidden">
        <div class="filter-option active" data-filter="none">なし</div>
        <div class="filter-option" data-filter="blur">ぼかし</div>
        <div class="filter-option" data-filter="grayscale">グレー</div>
        <div class="filter-option" data-filter="sepia">セピア</div>
        <div class="filter-option" data-filter="brightness">明るく</div>
    </div>

    <!-- 退室確認モーダル -->
    <div id="hangup-modal" class="hangup-modal hidden">
        <div class="hangup-modal-box">
            <div class="hangup-modal-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="2" width="18" height="20" rx="1"/>
                    <rect x="4.5" y="3.5" width="15" height="17"/>
                    <circle cx="17" cy="12" r="1.5" fill="currentColor" stroke="none"/>
                </svg>
            </div>
            <h3 class="hangup-modal-title">退室しますか？</h3>
            <p class="hangup-modal-desc">ルームから退室します</p>
            <div class="hangup-modal-actions">
                <button id="hangup-cancel" class="hangup-modal-btn cancel">キャンセル</button>
                <button id="hangup-confirm" class="hangup-modal-btn confirm">退室</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
    <script src="js/app.js?v=22"></script>

    <script>
        // タブを閉じる/ページ遷移時にリソースだけ解放（UI操作は不要）
        window.addEventListener('beforeunload', () => {
            if (!window.comChat) return;
            if (window.comChat.localStream) {
                window.comChat.localStream.getTracks().forEach(t => t.stop());
            }
            if (window.comChat.peer) {
                window.comChat.peer.destroy();
            }
        });

        // Error handling
        window.addEventListener('error', (e) => {
            console.error('Global error:', e.error);
            if (window.comChat && e.error) {
                window.comChat.showStatus('エラーが発生しました: ' + (e.error.message || 'Unknown error'), 'error');
            }
        });
    </script>

    <style>
        /* Additional inline styles for better UX */
        .room-info {
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 6px;
            margin: 4px 0;
            font-size: 0.85em;
            color: #555;
            flex-shrink: 0;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .username-edit-input {
            border: 1px solid #667eea;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.85em;
            width: 90px;
            outline: none;
            margin-left: 2px;
        }

        .confirm-btn { color: #28a745; font-weight: bold; }

        .edit-btn {
            display: inline-block;
            transform: scaleX(-1);
        }

        #room-id-display {
            font-weight: bold;
            color: #667eea;
            font-family: monospace;
        }

        .copy-btn {
            background: none;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 0.85em;
            padding: 3px 5px;
            border-radius: 4px;
            margin-left: 4px;
            vertical-align: middle;
            transition: background 0.15s, border-color 0.15s;
            line-height: 1;
            color: #667eea;
            display: inline-flex;
            align-items: center;
        }

        .copy-btn:hover {
            background: rgba(102, 126, 234, 0.12);
            border-color: rgba(102, 126, 234, 0.3);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Pulse animation for recording indicator */
        .recording {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Notification styles */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 退室確認モーダル */
        .hangup-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
            animation: modalOverlayIn 0.2s ease;
        }

        .hangup-modal.hidden {
            display: none !important;
        }

        @keyframes modalOverlayIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .hangup-modal-box {
            background: white;
            border-radius: 20px;
            padding: 32px 28px 24px;
            width: 260px;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.25);
            animation: modalBoxIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalBoxIn {
            from { transform: scale(0.8) translateY(16px); opacity: 0; }
            to   { transform: scale(1) translateY(0);      opacity: 1; }
        }

        .hangup-modal-icon {
            width: 56px;
            height: 56px;
            background: rgba(220, 53, 69, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #dc3545;
        }

        .hangup-modal-icon svg { width: 28px; height: 28px; }

        .hangup-modal-title {
            font-size: 1.1em;
            font-weight: 700;
            color: #222;
            margin-bottom: 6px;
        }

        .hangup-modal-desc {
            font-size: 0.82em;
            color: #999;
            margin-bottom: 24px;
        }

        .hangup-modal-actions {
            display: flex;
            gap: 10px;
        }

        .hangup-modal-btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .hangup-modal-btn.cancel {
            background: #f0f0f0;
            color: #555;
        }

        .hangup-modal-btn.cancel:hover {
            background: #e2e2e2;
        }

        .hangup-modal-btn.confirm {
            background: #dc3545;
            color: white;
        }

        .hangup-modal-btn.confirm:hover {
            background: #c82333;
            transform: scale(1.04);
        }

        .hangup-modal-btn.confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            .header {
                padding: 15px;
            }
            
            .logo {
                font-size: 1.8em;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .control-btn {
                width: 46px;
                height: 46px;
            }

            .control-btn svg {
                width: 22px;
                height: 22px;
            }

            .ctrl-label {
                font-size: 0.62em;
            }
        }
    </style>
</body>
</html>
