<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComChat - 完全無料ビデオ会議</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">ComChat</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="welcome-screen">
                <h1 class="welcome-title">友達と無料でビデオ通話しよう！</h1>
                <p class="welcome-description">
                    ComChatは完全無料のP2Pビデオ会議アプリです。<br>
                    最大6人まで同時通話が可能で、時間制限もありません。<br>
                    ブラウザだけで動作し、アプリのインストールは不要です。
                </p>
                
                <div class="input-group">
                    <label for="username">あなたの名前</label>
                    <input type="text" id="username" placeholder="名前を入力してください" value="ユーザー">
                </div>

                <div class="btn-group">
                    <button id="create-room" class="btn btn-primary">
                        🏠 ルーム作成
                    </button>
                    <button id="join-room" class="btn btn-secondary">
                        🚪 ルーム参加
                    </button>
                </div>

                <div id="join-group" class="input-group hidden" style="margin-top: 20px;">
                    <label for="join-room-id">ルームID</label>
                    <input type="text" id="join-room-id" placeholder="友達から共有されたルームIDを入力">
                    <button id="confirm-join" class="btn btn-secondary" style="margin-top: 10px; width: 100%;">参加する</button>
                </div>
            </div>

            <!-- Call Screen -->
            <div id="call-screen" class="hidden">
                <div class="call-layout">
                    <!-- Left: Video + Controls + Room Info -->
                    <div class="call-main">
                        <!-- Screen Share (presenter mode) -->
                        <div id="screen-share-container" class="hidden">
                            <video id="screen-share-video" autoplay playsinline></video>
                            <div id="screen-share-placeholder" class="screen-share-placeholder hidden">
                                🖥️<br>画面を共有中
                            </div>
                            <button id="stop-share-btn" class="stop-share-btn">⏹ 画面共有中（クリックで停止）</button>
                            <div id="share-viewer-label" class="share-viewer-label hidden"></div>
                        </div>

                        <!-- Video Grid -->
                        <div id="video-grid" class="video-grid">
                            <!-- Videos will be added here dynamically -->
                        </div>

                        <!-- Controls -->
                        <div class="controls">
                            <button id="toggle-video" class="control-btn video" title="カメラ オン/オフ">
                                📹
                            </button>
                            <button id="toggle-audio" class="control-btn audio" title="マイク オン/オフ">
                                🎤
                            </button>
                            <button id="share-screen" class="control-btn screen" title="画面共有">
                                🖥️
                            </button>
                            <button id="hangup" class="control-btn hangup" title="通話終了">
                                📞
                            </button>
                        </div>

                        <!-- Room Info -->
                        <div id="room-info" class="room-info hidden">
                            <span>ルームID: <span id="room-id-display"></span><button id="copy-room-id" class="copy-btn" title="ルームIDをコピー">📋</button></span>
                            <span>参加者: <span id="participant-count">1</span>/6</span>
                            <span class="username-info">名前: <span id="username-current"></span> <button id="edit-username-btn" class="copy-btn edit-btn" title="名前を変更">✏️</button><input id="username-edit-input" class="username-edit-input hidden" type="text" maxlength="20"><button id="username-confirm-btn" class="copy-btn confirm-btn hidden">✓</button></span>
                        </div>
                    </div>

                    <!-- Right: Chat -->
                    <div class="chat-container">
                        <div class="chat-header">チャット</div>
                        <div id="chat-messages" class="chat-messages">
                        </div>
                        <div class="chat-input-container">
                            <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力...">
                            <button id="chat-send" class="chat-send">送信</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
    <script src="js/app.js?v=3"></script>

    <script>
        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (window.comChat) {
                window.comChat.hangup();
            }
        });

        // Error handling
        window.addEventListener('error', (e) => {
            console.error('Global error:', e.error);
            if (window.comChat) {
                window.comChat.showStatus('エラーが発生しました: ' + e.error.message, 'error');
            }
        });
    </script>

    <style>
        /* Additional inline styles for better UX */
        .room-info {
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 6px;
            margin: 4px 0;
            font-size: 0.85em;
            color: #555;
            flex-shrink: 0;
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .username-edit-input {
            border: 1px solid #667eea;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.85em;
            width: 90px;
            outline: none;
            margin-left: 2px;
        }

        .confirm-btn { color: #28a745; font-weight: bold; }

        .edit-btn {
            display: inline-block;
            transform: scaleX(-1);
        }

        #room-id-display {
            font-weight: bold;
            color: #667eea;
            font-family: monospace;
        }

        .copy-btn {
            background: none;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 0.85em;
            padding: 2px 5px;
            border-radius: 4px;
            margin-left: 4px;
            vertical-align: middle;
            transition: background 0.15s, border-color 0.15s;
            line-height: 1;
        }

        .copy-btn:hover {
            background: rgba(102, 126, 234, 0.12);
            border-color: rgba(102, 126, 234, 0.3);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Pulse animation for recording indicator */
        .recording {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Notification styles */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            .header {
                padding: 15px;
            }
            
            .logo {
                font-size: 1.8em;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 1em;
            }
        }
    </style>
</body>
</html>
