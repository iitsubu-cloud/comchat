<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComChat - 完全無料ビデオ会議</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">ComChat</div>
            <div class="subtitle">完全無料 P2P ビデオ会議</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="welcome-screen">
                <h1 class="welcome-title">友達と無料でビデオ通話しよう！</h1>
                <p class="welcome-description">
                    ComChatは完全無料のP2Pビデオ会議アプリです。<br>
                    最大6人まで同時通話が可能で、時間制限もありません。<br>
                    ブラウザだけで動作し、アプリのインストールは不要です。
                </p>
                
                <div class="input-group">
                    <label for="username">あなたの名前</label>
                    <input type="text" id="username" placeholder="名前を入力してください" value="ユーザー">
                </div>

                <div class="btn-group">
                    <button id="create-room" class="btn btn-primary">
                        🏠 ルーム作成
                    </button>
                    <button id="join-room" class="btn btn-secondary">
                        🚪 ルーム参加
                    </button>
                </div>

                <div id="join-group" class="input-group hidden" style="margin-top: 20px;">
                    <label for="join-room-id">ルームID</label>
                    <input type="text" id="join-room-id" placeholder="友達から共有されたルームIDを入力">
                    <button id="confirm-join" class="btn btn-secondary" style="margin-top: 10px; width: 100%;">参加する</button>
                </div>
            </div>

            <!-- Call Screen -->
            <div id="call-screen" class="hidden">
                <!-- Status -->
                <div id="status" class="status connecting">
                    接続中...
                </div>

                <!-- Video Grid -->
                <div id="video-grid" class="video-grid">
                    <!-- Videos will be added here dynamically -->
                </div>

                <!-- Controls -->
                <div class="controls">
                    <button id="toggle-video" class="control-btn video" title="カメラ オン/オフ">
                        📹
                    </button>
                    <button id="toggle-audio" class="control-btn audio" title="マイク オン/オフ">
                        🎤
                    </button>
                    <button id="share-screen" class="control-btn screen" title="画面共有">
                        🖥️
                    </button>
                    <button id="hangup" class="control-btn hangup" title="通話終了">
                        📞
                    </button>
                </div>

                <!-- Chat Container -->
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages">
                        <div><strong>システム:</strong> チャット機能が有効になりました</div>
                    </div>
                    <div class="chat-input-container">
                        <input type="text" id="chat-input" class="chat-input" placeholder="メッセージを入力...">
                        <button id="chat-send" class="chat-send">送信</button>
                    </div>
                </div>

                <!-- Room Info -->
                <div id="room-info" class="room-info hidden">
                    <h3>ルーム情報</h3>
                    <p>ルームID: <span id="room-id-display"></span></p>
                    <p>参加者数: <span id="participant-count">1</span>/6</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>ComChat v1.0 - Made with ❤️ using PeerJS</p>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Handle page unload
        window.addEventListener('beforeunload', () => {
            if (window.comChat) {
                window.comChat.hangup();
            }
        });

        // Error handling
        window.addEventListener('error', (e) => {
            console.error('Global error:', e.error);
            if (window.comChat) {
                window.comChat.showStatus('エラーが発生しました: ' + e.error.message, 'error');
            }
        });
    </script>

    <style>
        /* Additional inline styles for better UX */
        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.9em;
        }

        .room-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .room-info h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .room-info p {
            margin: 5px 0;
            color: #666;
        }

        #room-id-display {
            font-weight: bold;
            color: #667eea;
            font-family: monospace;
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Pulse animation for recording indicator */
        .recording {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Notification styles */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            .header {
                padding: 15px;
            }
            
            .logo {
                font-size: 1.8em;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .controls {
                gap: 10px;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 1em;
            }
        }
    </style>
</body>
</html>
